name: openhab-garmin-e2e

# E2E harness stack.
#
#   app (Wine simulator, inside `runner`)  ->  shim  ->  openHAB
#
# openhab-stable and openhab-dev do not mount the fixtures themselves: a
# one-shot openhab-<profile>-init service stages them into the conf volume and
# the openHAB service starts only after that. A read-only bind mount underneath
# /openhab cannot work, because the image's entrypoint runs
# `chown -R openhab:openhab /openhab` under `set -e`.
#
# Profiles are exclusive on purpose: exactly one openHAB instance runs at a
# time, so the shim always has one upstream and the two services cannot fight
# over the same host port.
#
#   default (stable):  docker compose up -d
#   dev milestone:     COMPOSE_PROFILES=dev docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# Every published port is bound to the loopback address from
# tests/config/network.yaml, never to a wildcard address. The stack is not
# reachable from the network; terminate TLS externally with a reverse proxy if
# that is wanted. No certificate, key or CA material belongs here.
#
# On the dedicated Linux host, add the host-network overlay on top; the
# services then address each other as http://127.0.0.1:<port>:
#
#   docker compose -f compose.yaml -f compose.host.yaml up -d
#
# The dev profile needs its own override file: without it the shim would keep
# pointing at `openhab-stable`, which is not running under `dev`. The override
# is a separate file so that failure mode cannot happen silently.
#
# Start from `tests/compose/.env.example` and run
# `python -m e2e pin-images --write` first; every image reference below fails
# closed when its variable is missing or unpinned. Ports and the loopback host
# come from `tests/config/network.yaml` via the generated block in `.env`;
# change them there, not here.

services:
  openhab-stable-init:
    # One-shot fixture staging for openhab-stable. It reuses the pinned openHAB
    # image on purpose: it seeds the same `dist/conf` skeleton the image's
    # entrypoint would (openHAB then skips that, because the volume is not
    # empty), it ships `cp`, and its uid/gid is the one openHAB runs as. No
    # third image has to be pinned and vouched for.
    profiles: ["stable"]
    image: ${OPENHAB_STABLE_IMAGE:?run `python -m e2e pin-images --write` in tests/runner and set CIQ_SDK_HOST_PATH in tests/compose/.env}
    restart: "no"
    network_mode: none
    entrypoint: ["/bin/sh", "/seed-conf.sh"]
    # The image's CMD would otherwise be appended to the seed script.
    command: []
    healthcheck:
      disable: true
    volumes:
      - openhab-stable-conf:/openhab/conf
      - ../fixtures/openhab/conf:/fixtures:ro
      - ./seed-openhab-conf.sh:/seed-conf.sh:ro

  openhab-stable:
    profiles: ["stable"]
    image: ${OPENHAB_STABLE_IMAGE:?run `python -m e2e pin-images --write` in tests/runner and set CIQ_SDK_HOST_PATH in tests/compose/.env}
    restart: "no"
    depends_on:
      openhab-stable-init:
        condition: service_completed_successfully
    ports:
      - "${E2E_LOOPBACK_HOST:?set E2E_LOOPBACK_HOST in tests/compose/.env}:${OPENHAB_STABLE_PORT:?set OPENHAB_STABLE_PORT in tests/compose/.env}:8080"
    volumes:
      # The image ships a conf skeleton (items/, sitemaps/, rules/, ...) that
      # openHAB expects to be able to write to, so conf is a writable named
      # volume. openhab-stable-init fills it with that skeleton plus the
      # fixtures from this repository before this service starts; the fixtures
      # are never mounted read-only underneath /openhab, because the
      # entrypoint's `chown -R openhab:openhab /openhab` aborts on them.
      - openhab-stable-conf:/openhab/conf
      - openhab-stable-userdata:/openhab/userdata
    environment:
      OPENHAB_HTTP_PORT: "8080"
      OPENHAB_HTTPS_PORT: "8443"
      CRYPTO_POLICY: unlimited
      EXTRA_JAVA_OPTS: ${OPENHAB_JAVA_OPTS:--Duser.timezone=UTC}
    healthcheck:
      # curl is part of the openHAB image (it is also what the image's own
      # HEALTHCHECK uses), so this never depends on a missing binary.
      # $$ escapes Compose interpolation; the container shell expands the port
      # the container actually listens on, which differs under host networking.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:$${OPENHAB_HTTP_PORT}/rest/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [e2e]

  openhab-dev-init:
    # One-shot fixture staging for openhab-dev; see openhab-stable-init.
    profiles: ["dev"]
    image: ${OPENHAB_DEV_IMAGE:?run `python -m e2e pin-images --write` in tests/runner and set CIQ_SDK_HOST_PATH in tests/compose/.env}
    restart: "no"
    network_mode: none
    entrypoint: ["/bin/sh", "/seed-conf.sh"]
    command: []
    healthcheck:
      disable: true
    volumes:
      - openhab-dev-conf:/openhab/conf
      - ../fixtures/openhab/conf:/fixtures:ro
      # Dev-only overlay. The pinned stable image cannot parse `confirmCmd`
      # (openHAB 5.3+), and one rejected element makes openHAB drop the whole
      # model, so the confirmation fixture is staged only for this profile.
      - ../fixtures/openhab/conf-dev:/fixtures-dev:ro
      - ./seed-openhab-conf.sh:/seed-conf.sh:ro
    environment:
      FIXTURES_OVERLAY_DIR: /fixtures-dev

  openhab-dev:
    profiles: ["dev"]
    image: ${OPENHAB_DEV_IMAGE:?run `python -m e2e pin-images --write` in tests/runner and set CIQ_SDK_HOST_PATH in tests/compose/.env}
    restart: "no"
    depends_on:
      openhab-dev-init:
        condition: service_completed_successfully
    ports:
      - "${E2E_LOOPBACK_HOST:?set E2E_LOOPBACK_HOST in tests/compose/.env}:${OPENHAB_DEV_PORT:?set OPENHAB_DEV_PORT in tests/compose/.env}:8080"
    volumes:
      - openhab-dev-conf:/openhab/conf
      - openhab-dev-userdata:/openhab/userdata
    environment:
      OPENHAB_HTTP_PORT: "8080"
      OPENHAB_HTTPS_PORT: "8443"
      CRYPTO_POLICY: unlimited
      EXTRA_JAVA_OPTS: ${OPENHAB_JAVA_OPTS:--Duser.timezone=UTC}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:$${OPENHAB_HTTP_PORT}/rest/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [e2e]

  shim:
    build:
      context: ..
      dockerfile: shim/Dockerfile
      args:
        SHIM_BASE_IMAGE: ${SHIM_BASE_IMAGE:?set SHIM_BASE_IMAGE in tests/compose/.env}
    image: openhab-garmin-e2e-shim:${SHIM_VERSION:-dev}
    restart: "no"
    ports:
      - "${E2E_LOOPBACK_HOST:?set E2E_LOOPBACK_HOST in tests/compose/.env}:${SHIM_PORT:?set SHIM_PORT in tests/compose/.env}:8080"
    environment:
      OPENHAB_UPSTREAM: ${OPENHAB_UPSTREAM:-http://openhab-stable:8080}
      SHIM_VERSION: ${SHIM_VERSION:-dev}
      SHIM_BIND: 0.0.0.0
      SHIM_PORT: "8080"
    healthcheck:
      # SHIM_PORT is the port this process actually listens on: 8080 on the
      # bridge profile, the published host port under host networking.
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('SHIM_PORT', '8080') + '/__shim__/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [e2e]

  runner:
    build:
      context: ..
      dockerfile: runner/Dockerfile
      args:
        RUNNER_BASE_IMAGE: ${RUNNER_BASE_IMAGE:?set RUNNER_BASE_IMAGE in tests/compose/.env}
    image: openhab-garmin-e2e-runner:${RUNNER_VERSION:-dev}
    restart: "no"
    working_dir: /work/tests/runner
    entrypoint: ["/entrypoint.sh"]
    command: ["sleep", "infinity"]
    tty: true
    stdin_open: true
    init: true
    environment:
      # The SDK is bind-mounted read-only at CIQ_SDK_MOUNT. `monkeyc` rewrites
      # `$SDK/bin/default.jungle`, so entrypoint.sh copies the mount to
      # CIQ_SDK_WORKDIR (writable) and exports CIQ_SDK_ROOT to the copy; the
      # operator's SDK is never modified. The host path is CIQ_SDK_HOST_PATH,
      # used only for the bind mount below.
      CIQ_SDK_MOUNT: /opt/ciq-sdk
      CIQ_SDK_WORKDIR: /tmp/ciq-sdk
      # These two are also what the app settings fixtures resolve their
      # `${E2E_SHIM_URL}` token from, so the app and the runner always talk to
      # the same endpoint. The host overlay replaces them with loopback URLs.
      E2E_OPENHAB_URL: ${E2E_OPENHAB_URL:-http://openhab-stable:8080}
      E2E_SHIM_URL: ${E2E_SHIM_URL:-http://shim:8080}
      # The artifacts volume must not be nested inside a read-only mount:
      # Docker has to create the mountpoint, which fails on a read-only tree.
      # /artifacts is its own top-level mount, outside the read-only checkout.
      E2E_ARTIFACTS: /artifacts
      # The fixture guard reads the expected sets and DSL warnings from the
      # same fixture tree `openhab-<profile>-init` stages, never from the
      # checkout mounted at /work. If E2E_REPO_ROOT points the runner at a
      # different checkout, the guard compares the two trees and fails loudly
      # instead of asserting against fixtures openHAB never saw.
      E2E_FIXTURES_DIR: /e2e-fixtures
      # The openHAB logs are mounted read-only from the profile's userdata
      # volume so a rejected DSL model can be reported with the exact
      # `DSL model ... has errors` lines, not just "the item is missing".
      E2E_OPENHAB_LOG_DIR: /openhab-logs
      DISPLAY: ":99"
      PYTHONUNBUFFERED: "1"
    volumes:
      # The SDK is mounted, never baked into the image: Garmin's agreement
      # forbids redistribution. It is read-only on purpose; see the copy in
      # entrypoint.sh.
      - ${CIQ_SDK_HOST_PATH:?set CIQ_SDK_HOST_PATH to the Connect IQ SDK root in tests/compose/.env}:/opt/ciq-sdk:ro
      # Optional device definitions when the mounted SDK does not ship them.
      # Unset by default, so the source becomes an empty declared volume
      # instead of a bind mount; entrypoint.sh links whatever it finds into
      # $HOME/.Garmin/ConnectIQ/Devices.
      - ${CIQ_DEVICES_HOST_PATH:-e2e-empty-devices}:/opt/ciq-devices:ro
      - ${E2E_REPO_ROOT:-../..}:/work:ro
      - ../fixtures:/e2e-fixtures:ro
      # Logs only: the openHAB services still own these volumes read-write.
      - openhab-stable-userdata:/openhab-logs/stable:ro
      - openhab-dev-userdata:/openhab-logs/dev:ro
      - e2e-artifacts:/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import e2e"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [e2e]

networks:
  e2e:
    driver: bridge

volumes:
  # One conf and one userdata volume per openHAB instance: the JSONDB and any
  # generated config of a dev run must never leak into a stable run.
  openhab-stable-conf:
  openhab-stable-userdata:
  openhab-dev-conf:
  openhab-dev-userdata:
  e2e-artifacts:
  # Only used as the source of the optional /opt/ciq-devices mount when
  # CIQ_DEVICES_HOST_PATH is unset: an empty volume keeps the mount harmless.
  e2e-empty-devices:
