# Regression scope for issue #140.
#
# Each entry is one bullet of the issue. `id` is the stable identifier a
# scenario uses in its `covers:` list; do not rename an existing id, because
# that silently disconnects the scenarios that reference it. Add a new id when
# #140 gains a bullet, and remove one only when the issue drops the bullet.
#
# `title` is a short, stable paraphrase of the bullet. The issue text is the
# source of truth; this file exists so the suite can be checked mechanically.
#
# `verified_by` on a waiver names another automated check that proves the
# bullet. It is optional and does not turn a waiver into scenario coverage.
#
# Keep this file and #140 in step. The coverage check fails when an entry has
# no scenario and no waiver, and when a scenario covers an unknown id:
#
#   cd tests/runner && python -m e2e coverage --check
#
# tests/docs/coverage.md is generated from this file and the scenarios.

version: 1
issue: 140
source: https://github.com/openhab/openhab-garmin/issues/140

sections:
  - id: sitemap
    title: Sitemap elements and rendering
    number: "1"
  - id: communication
    title: Communication layer - modes and transitions
    number: "2"
  - id: commands
    title: Commands
    number: "3"
  - id: settings
    title: Settings and configuration
    number: "4"
  - id: lifecycle
    title: App lifecycle and device integration
    number: "5"
  - id: localisation
    title: Localization and translated UI
    number: "6"
  - id: errors
    title: Error handling - temporary, critical and fatal
    number: "7"
  - id: limits
    title: Load and limits
    number: "8"
  - id: resilience
    title: Restart, outage and resilience
    number: "9"
  - id: devices
    title: Device coverage
    number: ""

