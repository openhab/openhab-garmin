# A blocked entry is different: the harness cannot exercise it until the
# tracked issue is resolved. It renders as "Blocked" and links to that issue,
# the same way unsupported languages are reported. Blocked and waived are
# mutually exclusive, and an entry that a scenario covers must not stay blocked.

# A waiver is a deliberate decision not to cover an entry with a scenario,
# including "not yet verified": the reason must say which it is, and what would
# verify it. `verified_by` may name a separate automated check. A waiver for an
# entry that a scenario covers is an error.
waivers:
  # ---- Not yet verified: no known defect, but no scenario or capture yet
  - id: lifecycle.glance-widget
    reason: >-
      Not yet verified, and not blocked by a known defect. The font crash that
      once justified this entry was the empty device font pack: staging the
      pack (`~/.Garmin/ConnectIQ/Fonts`) makes app views paint, and the app
      opens on the glance with DOWN then SELECT, so the latch hypothesis is
      retired. What remains is coverage: E2E builds use the `watch-app` profile,
      which stubs the glance view, and no scenario visits or captures the
      glance. Verify it with `python -m e2e build --device fenix7
      --with-glance`, then a scenario that lands on the glance, waits for
      `category=glance` and captures it; the entry stays unverified until that
      capture is reviewed.
  - id: devices.capabilities
    reason: >-
      Not yet verified, and not blocked by a known defect. The device matrix
      records no capability dimension, so capability variants are not asserted
      per device (the known #366 gap), and no scenario visits the glance, so its
      per-device capability is unasserted too. Wi-Fi mode itself is covered by
      the dedicated scenarios. Verify the glance half with a `--with-glance`
      capture on each glance-capable device.

  # ---- Sitemap rendering that needs input or goldens the harness cannot drive yet
  - id: sitemap.parameters-label-icon
    reason: >-
      The fixture carries icons and label formats, but no scenario asserts the
      rendered result; reviewed goldens for those pages have not been captured.
  - id: sitemap.parameters-colors
    reason: >-
      labelcolor/valuecolor are in the fixture, but proving them is a pixel
      comparison; no reviewed goldens exist yet.
  - id: sitemap.parameters-range
    reason: >-
      Setpoint and Slider need a value-picker interaction the current step
      vocabulary cannot drive, and the rendered result needs reviewed goldens.
  - id: sitemap.theme
    reason: >-
      Changing the simulator's light/dark/night theme is a device UI action
      that the harness does not drive; the #370 spike explores it outside the
      suite.

  # ---- Communication transitions need a mode switch the driver does not offer
  - id: communication.transitions
    reason: >-
      The driver can start in each mode but cannot switch modes mid-run; the
      simulator Connection menu is not part of the scenario actions.
  - id: communication.transition-indicators
    reason: >-
      Status indicators after a transition need the same mid-run mode switch as
      communication.transitions.
  - id: communication.transition-data
    reason: >-
      The mode-start behaviour is covered by wifi-mode and offline-mode, but
      the transition case needs a mid-run mode switch.

  # ---- Settings
  - id: settings.every-setting
    reason: >-
      Individual settings are exercised by fixtures (REST API, webhook,
      suppress-empty, polling, hold time), but no scenario asserts the
      openHAB-facing effect of every setting, especially URL, auth and a
      missing sitemap.
  - id: settings.myopenhab
    reason: >-
      myopenHAB needs a real or mocked home.myopenhab.org endpoint with
      credentials; the Compose stack deliberately has neither.
  - id: settings.change-while-running
    reason: >-
      The driver has no step that mutates device settings after launch, so the
      fatal settings-change path cannot be triggered from a scenario.

  # ---- Lifecycle
  - id: lifecycle.deferred-errors
    reason: >-
      Hiding the app and resuming it needs a device sleep or app-switcher
      action the driver cannot issue; errors.deferred has the same gap.
  - id: lifecycle.stop-start
    reason: >-
      A scenario has exactly one launch step, so stop/start and termination
      after inactivity cannot be expressed in one scenario.
  - id: lifecycle.connection-return
    reason: >-
      Returning to the phone or network is a mid-run mode transition, which the
      driver cannot drive (see communication.transitions).

  # ---- Localization
  - id: localisation.fallback
    reason: >-
      Proving a missing translation falls back requires a build with a string
      resource removed; the harness must not alter app resources to test them.

  # ---- Errors
  - id: errors.fatal
    reason: >-
      A fatal UI error cannot be triggered through the shim, and the settings
      change path needs settings mutation after launch (settings.change-while-running).
  - id: errors.deferred
    reason: >-
      Deferred error presentation needs the app hidden before the error occurs;
      see lifecycle.deferred-errors for the driver limitation.
  - id: errors.cache-invalidation
    reason: >-
      No trace event distinguishes a cached sitemap from a fresh one, so
      "no stale sitemap" is only observable in pixels; no golden covers the
      critical or fatal path yet.

  # ---- Limits
  - id: limits.large-data
    reason: >-
      The repository fixtures are intentionally small; a large, deeply nested
      sitemap fixture does not exist and adding one is a fixture-design decision
      for #140, not a scenario-level addition.
  - id: limits.storage-memory
    reason: >-
      Reaching the device storage or memory limits (-403) needs a low-memory
      device or a way to exhaust storage; neither is scriptable through the
      shim.

  # ---- Resilience
  - id: resilience.soak
    reason: >-
      Repeated restarts and a soak run do not fit the per-scenario budget and
      belong to a scheduled campaign, not to the pull-request suite; polling
      interval 0 is not exercised by a scenario either.

  # ---- Device coverage is proven by the matrix check, not by scenarios
  - id: devices.watches
    reason: The approved device matrix represents every watch input capability.
    verified_by: python -m e2e variants
  - id: devices.ciq-tiers
    reason: Every CIQ API tier resolved from monkey.jungle has a matrix device.
    verified_by: python -m e2e variants
  - id: devices.edge-input
    reason: The matrix includes button and touch Edge devices.
    verified_by: python -m e2e variants
  - id: devices.edge-resources
    reason: The matrix includes short and tall Edge resource variants.
    verified_by: python -m e2e variants
  - id: devices.screens
    reason: The matrix includes round and rectangular screens.
    verified_by: python -m e2e variants
  - id: devices.menus
    reason: The matrix includes ActionMenu and full-menu implementations.
    verified_by: python -m e2e variants
  - id: devices.source-variants
    reason: >-
      Every source/config variant is assigned to a matrix device; the
      GlanceConfig variants still compile in the `watch-app` profile (only
      the glance view itself is stubbed), and `e2e variants` proves the
      assignment.
    verified_by: python -m e2e variants
