# Regression: post-command hold time.
#
# `postCommandHoldTime_0` is 2 s in the `default` fixture (docs/USAGE.md,
# "App Settings"). The stale-response flip-back it prevents is a rendering
# behaviour: no trace field carries the item state that is shown, so this
# scenario proves the command is sent once and polling continues, and the
# visual hold is an explicit manual check.
#
# `fast-polling` deliberately sets the hold time to 0 for command scenarios
# that need the server state immediately; this scenario must not use it.

name: post-command-hold
description: A command is sent once and the 2 s hold window does not disturb polling.
tier: ui
suite: regression
device: fenix7
mode: ble
fixture: default
openhab:
  profile: stable
  sitemap: garmin_commands
  items:
    E2E_Toggle: "OFF"
language: eng
timeout_s: 300

covers:
  - commands.hold-time
  - commands.types
  - sitemap.parameters-controls
manual_checks:
  - >-
    The switch must not visibly flip back to OFF during the 2 s hold window.
    No trace field carries item state, so compare the `after-command` and
    `after-hold` screenshots (or add a reviewed golden) by hand.
  - >-
    The `0` disables it path is covered by the fast-polling command scenarios;
    this scenario proves only the non-zero hold.

settings:
  sitemap_0: garmin_commands

steps:
  - action: launch

  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_commands
    min_count: 1
    timeout_ms: 30000

  - action: reset_shim

  # The press must land on the homepage, not on the loading view: a click sent
  # while the menu is still being built is consumed by the view change and never
  # reaches the delegate. The app-side evidence cannot tell those apart on its
  # own, so wait for the view first.
  - action: wait_for_view
    description: The homepage menu is on screen before the opening press.
    category: sitemap
    view: HomepageMenu
    timeout_ms: 30000

  # Widgets is the first frame -> its first element is the Toggle Switch.
  # A Frame opens as a submenu, so the element needs a second select.
  # `expect: input` requires the app's own event, so a repaint cannot pass for a
  # delivered press; the driver re-issues an unacknowledged press once.
  - action: press
    button: ENTER
    expect: input
    timeout_ms: 6000

  - action: wait_for_event
    description: The Widgets frame page is rendered before selecting its element.
    event: VIEW
    fields:
      category: sitemap
      view: PageMenu
    timeout_ms: 30000

  - action: press
    button: ENTER

  - action: wait_for_request
    method: POST
    path_prefix: /rest/items/E2E_Toggle
    min_count: 1
    timeout_ms: 15000

  # openHAB 5.0 and newer accept the command JSON-wrapped; the app sends
  # {"value":"ON"} with Content-Type: application/json (NativeCommandRequest),
  # because the Garmin SDK cannot send raw request content. The payload is
  # asserted exactly: this is what pins the documented contract.
  - action: assert
    description: >-
      Exactly one command is sent while the item is held, as the documented
      JSON payload {"value":"ON"} with status 200.
    shim_requests:
      method: POST
      path_prefix: /rest/items/E2E_Toggle
      min_count: 1
      max_count: 1
      body_equals: '{"value":"ON"}'
      status: 200

  - action: screenshot
    name: after-command

  # Longer than the 2 s hold and the 1 s poll interval.
  - action: wait
    ms: 2500

  - action: screenshot
    name: after-hold

  - action: assert
    description: Polling continues during and after the hold window.
    shim_requests:
      method: GET
      path_prefix: /rest/sitemaps/garmin_commands
      min_count: 2

  - action: assert
    description: No error view appears while the command is held.
    never_error_view: true
