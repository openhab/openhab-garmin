# Regression: a command failure is a temporary error.
#
# A failed command must show a toast, must not escalate to the full-screen
# error view and must not disturb sitemap polling (docs/USAGE.md,
# "How the App Handles Errors"). The shim fails only the command POST; the
# sitemap polls keep reaching openHAB, which is what makes the "no escalation"
# assertion meaningful.

name: command-error-temporary
description: A failed command shows a temporary toast and sitemap polling continues.
tier: ui
suite: regression
device: fenix7
mode: ble
fixture: fast-polling
openhab:
  profile: stable
  sitemap: garmin_commands
  items:
    E2E_Toggle: "OFF"
language: eng
timeout_s: 300

covers:
  - commands.errors
  - errors.temporary
  - errors.no-escalation
  - errors.codes-messages

shim:
  rules:
    - name: command-fails
      match:
        method: POST
        path_prefix: /rest/items/E2E_Toggle
      times: 1
      response:
        status: 500
        body: command failed

settings:
  sitemap_0: garmin_commands

steps:
  - action: launch

  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_commands
    min_count: 1
    timeout_ms: 30000

  - action: reset_shim

  # Widgets is the first frame -> its first element is the Toggle Switch.
  # A Frame opens as a submenu, so the element needs a second select.
  # The opening press is measured: the guest loses the first click after a view
  # appears, so a silent press is re-issued by the driver and named if it stays
  # silent, instead of surfacing as a timeout two steps later.
  - action: press
    button: ENTER
    expect: effect
    timeout_ms: 6000

  - action: wait_for_event
    description: The Widgets frame page is rendered before selecting its element.
    event: VIEW
    fields:
      category: sitemap
      view: PageMenu
    timeout_ms: 30000

  - action: press
    button: ENTER

  - action: wait_for_request
    method: POST
    path_prefix: /rest/items/E2E_Toggle
    min_count: 1
    timeout_ms: 15000

  - action: assert
    description: The command reached the shim and was answered with the scripted failure.
    shim_requests:
      method: POST
      path_prefix: /rest/items/E2E_Toggle
      min_count: 1
      max_count: 1
      status: 500

  - action: wait_for_event
    description: A failed command is a temporary error sourced from the command path.
    event: ERROR
    fields:
      kind: temporary
      source: command
    timeout_ms: 30000

  - action: screenshot
    name: command-error-toast

  # The polling loop must be unaffected: at least three more polls within the
  # next few seconds, while the command error is still the most recent failure.
  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_commands
    min_count: 3
    timeout_ms: 15000

  - action: assert
    description: A command error must never raise the full-screen error view.
    never_error_view: true
