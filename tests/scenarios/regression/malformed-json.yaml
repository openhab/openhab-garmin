# Regression: a malformed sitemap body.
#
# Truncated JSON is not a communication error: the app fails while parsing the
# response, which is a critical (recoverable) error and shows the full-screen
# error view while polling continues. The recovery half of this scenario
# asserts that a valid response restores the sitemap without a restart.
#
# This scenario keeps its faults installed before launch, unlike
# `empty-response` and `http-503-recovery`. The critical classification is what
# the app does on a cold start: with no stored sitemap every sitemap error is
# "stale" and escalates immediately (SitemapStore.isSitemapFresh), so the error
# view is expected here and a warm-up would turn this into a toast instead.

name: malformed-json
description: Truncated JSON shows the critical error view and recovers on a valid response.
tier: protocol
suite: regression
device: fenix7
mode: ble
fixture: fast-polling
openhab:
  profile: stable
  sitemap: garmin_e2e
  items:
    E2E_Temperature: "20.0"
language: eng
timeout_s: 300

covers:
  - errors.critical
  - errors.recovery
  - errors.codes-messages
manual_checks:
  - >-
    No trace event distinguishes a cached sitemap from a fresh one, so cache
    invalidation before the error repeats is not asserted.

shim:
  rules:
    - name: truncated
      match:
        method: GET
        path_prefix: /rest/sitemaps/garmin_e2e
      times: 2
      response:
        status: 200
        body: '{"homepage": ['
        content_type: application/json

steps:
  - action: launch

  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_e2e
    min_count: 2
    timeout_ms: 30000

  # A request recorded by the shim carries the body the app *sent* (empty for a
  # GET) and the status and fault it was answered with; the served body is
  # never recorded. `body_equals` therefore cannot prove which body reached the
  # app -- the applied rule name can, and the served status distinguishes the
  # fault from an upstream answer.
  - action: assert
    description: >-
      The shim served the truncated body instead of openHAB: status 200 with the
      'truncated' rule applied to at least two polls.
    shim_requests:
      method: GET
      path_prefix: /rest/sitemaps/garmin_e2e
      min_count: 2
      status: 200
      matched_rule: truncated

  - action: wait_for_event
    description: Parsing the sitemap fails as a critical (recoverable) error.
    event: ERROR
    fields:
      kind: critical
    timeout_ms: 30000

  - action: wait_for_event
    description: The critical error reaches the full-screen error view.
    event: VIEW
    fields:
      category: error
    timeout_ms: 30000

  - action: screenshot
    name: critical-error

  # Polling must continue while the critical error is shown, and a valid
  # response must bring the sitemap back.
  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_e2e
    min_count: 4
    timeout_ms: 45000

  # One poll interval of fast-polling for the app to switch back.
  - action: wait
    ms: 1500

  - action: screenshot
    name: recovered

  - action: assert
    description: >-
      The error view was dismissed: the current view is the sitemap view, not
      the error view, without a restart.
    no_error_view: true