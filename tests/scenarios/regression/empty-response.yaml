# Regression: an empty sitemap response.
#
# An HTTP 200 with a zero-length body must surface as `S:EMRES` (temporary
# error). The default fixture keeps "suppress errors for empty sitemap
# responses" off; `suppress-empty.yaml` covers the suppressed variant, which is
# a separate scenario rather than a variant here so the toasts stay assertable.
#
# The faults are installed *after* one successful poll on purpose: with no
# stored sitemap the app treats the first failure as stale and shows the
# full-screen error view immediately, so a pre-launch script would only ever
# exercise the critical path (see `malformed-json`, which asserts exactly that).

name: empty-response
description: Empty 200 responses surface as S:EMRES toasts.
tier: protocol
suite: regression
device: fenix7
mode: ble
fixture: default
openhab:
  profile: stable
  sitemap: garmin_e2e
  items:
    E2E_Temperature: "20.0"
language: eng
timeout_s: 300

covers:
  - errors.temporary
  - errors.no-escalation
  - errors.codes-messages
manual_checks:
  - >-
    The suppressed-empty variant (the `suppress-empty` fixture) and the
    cached-versus-uncached escalation distinction are not exercised here.

steps:
  - action: launch

  # Warm-up: poll openHAB once so the app holds a fresh sitemap.
  - action: wait_for_event
    description: The fault-free first poll cached the sitemap.
    event: SITEMAP
    fields:
      result: success
    timeout_ms: 60000

  - action: reset_shim

  - action: install_faults
    description: The next two polls are answered by the shim with an empty 200.
    rules:
      - name: empty-body
        match:
          method: GET
          path_prefix: /rest/sitemaps/garmin_e2e
        times: 2
        response:
          status: 200
          body: ""
          content_type: application/json

  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_e2e
    min_count: 2
    timeout_ms: 30000

  - action: assert
    description: >-
      Both scripted empty responses were served by the shim: status 200, zero
      bytes, the 'empty-body' rule applied. The recorder keeps the request, not
      the response body, so the rule name is the proof.
    shim_requests:
      method: GET
      path_prefix: /rest/sitemaps/garmin_e2e
      min_count: 2
      status: 200
      matched_rule: empty-body

  - action: wait_for_event
    description: An empty response is a temporary error, not a critical one.
    event: ERROR
    fields:
      kind: temporary
    timeout_ms: 30000

  - action: screenshot
    name: empty-response-toast

  - action: assert
    description: An empty response never raises the full-screen error view.
    never_error_view: true