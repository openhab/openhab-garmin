# Regression: command confirmation.
#
# `commandConfirmMessage` makes the app show a confirmation dialog before the
# command is sent (docs/USAGE.md, "Command Confirmation"). Cancelling must
# send nothing, which is asserted on the shim trace rather than on the screen.
#
# This runs on the dev profile: the `confirmCmd` sitemap parameter and the
# `commandConfirmMessage` REST field were added in openHAB core 5.3
# (openhab/openhab-core#5769). The pinned stable image (5.2.5) predates them,
# so it cannot express or return a confirmation at all. `garmin_confirm.sitemap`
# is staged only by `openhab-dev-init`; see issue #394 for the finding.

name: command-confirmation
description: Cancelling a confirmed command sends nothing to openHAB.
tier: ui
suite: regression
device: fenix7
mode: ble
fixture: fast-polling
openhab:
  profile: dev
  sitemap: garmin_confirm
  items:
    E2E_GarageDoor: "OFF"
language: eng
timeout_s: 300

covers:
  - sitemap.parameters-mappings
  - commands.types
notes: >-
  The stable pin cannot carry the `confirmCmd` parameter or the
  `commandConfirmMessage` field, so this scenario must be run against the dev
  profile: `COMPOSE_PROFILES=dev docker compose -f compose.yaml -f
  compose.dev.yaml up -d`.

settings:
  sitemap_0: garmin_confirm

steps:
  - action: launch

  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_confirm
    min_count: 1
    timeout_ms: 30000

  - action: wait_for_event
    description: The homepage menu is rendered before navigation starts.
    event: VIEW
    fields:
      category: sitemap
      view: HomepageMenu
    timeout_ms: 60000

  - action: reset_shim

  # The homepage has one frame ("Confirm"); open it, then select its only
  # element ("Garage Door Confirm").
  - action: press
    button: ENTER

  - action: wait_for_event
    description: The frame page is rendered before selecting its element.
    event: VIEW
    fields:
      category: sitemap
      view: PageMenu
    timeout_ms: 30000

  - action: press
    button: ENTER

  # Selecting the element opens the confirmation dialog; the dialog is the
  # first thing the command menu shows for a single mapping.
  - action: screenshot
    name: confirmation-dialog

  - action: press
    button: BACK

  - action: screenshot
    name: after-cancel

  - action: assert
    description: Cancelling the confirmation must not send a command.
    shim_requests:
      method: POST
      path_prefix: /rest/items/E2E_GarageDoor
      max_count: 0
