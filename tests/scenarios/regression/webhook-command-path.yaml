# Regression: the webhook command path.
#
# With `restapi_0: false` and a webhook identifier, commands go to
# `GET {url}webhook/{id}?action=sendCommand&itemName=...&command=...` instead of
# `POST /rest/items/{name}` (docs/USAGE.md, "Sending Commands"). The shim sees
# both the sitemap poll and the webhook request, so the two paths are
# distinguishable in one trace.

name: webhook-command-path
description: With the REST API disabled, the command is sent to the webhook path.
tier: ui
suite: regression
device: fenix7
mode: ble
fixture: webhook-only
openhab:
  profile: stable
  sitemap: garmin_commands
  items:
    E2E_Toggle: "OFF"
language: eng
timeout_s: 300

covers:
  - commands.paths
manual_checks:
  - >-
    The webhook is answered by openHAB with 404 because the Webhook binding is
    not installed in the fixture; the scenario asserts the request path, not a
    successful openHAB-side webhook execution.
  - A missing or incorrect webhook identifier is not exercised.

settings:
  sitemap_0: garmin_commands

steps:
  - action: launch

  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_commands
    min_count: 1
    timeout_ms: 30000

  - action: reset_shim

  # The press must land on the homepage, not on the loading view: a click sent
  # while the menu is still being built is consumed by the view change and never
  # reaches the delegate. The app-side evidence cannot tell those apart on its
  # own, so wait for the view first.
  - action: wait_for_view
    description: The homepage menu is on screen before the opening press.
    category: sitemap
    view: HomepageMenu
    timeout_ms: 30000

  # Widgets is the first frame -> its first element is the Toggle Switch.
  # A Frame opens as a submenu, so the element needs a second select.
  # `expect: input` requires the app's own event, so a repaint cannot pass for a
  # delivered press; the driver re-issues an unacknowledged press once.
  - action: press
    button: ENTER
    expect: input
    timeout_ms: 6000

  - action: wait_for_event
    description: The Widgets frame page is rendered before selecting its element.
    event: VIEW
    fields:
      category: sitemap
      view: PageMenu
    timeout_ms: 30000

  - action: press
    button: ENTER

  - action: wait_for_request
    method: GET
    path_prefix: /webhook/e2e-webhook
    min_count: 1
    timeout_ms: 15000

  # The webhook is a GET, so its payload is the query string, not a body:
  # action and itemName are fixed in WebhookCommandRequest, command is appended.
  # Asserting the query is what pins the documented payload; a bare path match
  # would only prove that *some* webhook request happened.
  - action: assert
    description: >-
      The command is carried in the webhook query (action, itemName and command
      as GET parameters), not as a request body.
    shim_requests:
      method: GET
      path_prefix: /webhook/e2e-webhook
      path_contains: "action=sendCommand&itemName=E2E_Toggle&command=ON"
      min_count: 1

  - action: assert
    description: No REST command is sent when the REST API is disabled.
    shim_requests:
      method: POST
      path_prefix: /rest/items/
      max_count: 0

  - action: screenshot
    name: webhook-command

  - action: assert
    description: No error view appears on a successful command.
    never_error_view: true
