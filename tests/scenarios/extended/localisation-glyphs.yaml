# Extended: glyph coverage for the accented characters shipped in the app.
#
# The translated runtime strings use these non-ASCII characters:
#
#   deu  Ö ß ä ö ü        fre  À É à è é ê        ita  à è
#   spa  Ú á é í ñ ó      pol  Ł ą ć ę ł ń ó ś ź ż
#
# This scenario visits the screens that contain them without an error path:
# the homepage connection indicator (`ConnectionModePhoneBle`), the empty-page
# toast (`EmptyPage`), and the Player view (`PlayerPlay`/`PlayerPause`/
# `PlayerNext`/`PlayerPrevious`). The settings and error glyph surfaces are
# captured by the settings and error scenarios.
#
# Rows are addressed by their focused label (`E2E:FOCUS`), not by a press
# count: the same DOWN count lands on a different row when a device's layout
# scrolls differently, which is what failed on edge540 (#430). Only DOWN/UP is
# re-issued, and only after the app reported where the highlight is.
#
# IMPORTANT: screenshot text is NOT machine-asserted. The harness has no OCR or
# region-hash assertion, so the PNGs are declared as review artifacts. See
# tests/docs/localisation.md for the review procedure and the exact characters
# to look for.

name: localisation-glyphs
description: Screens with accented translated strings are captured for glyph review.
tier: ui
suite: extended
device: edge540
mode: ble
fixture: fast-polling
openhab:
  profile: stable
  sitemap: garmin_localisation
  items:
    E2E_Toggle: "OFF"
    E2E_MediaControl: "PLAY"
    E2E_Temperature: "21.5"
languages: [eng, deu, fre, ita, spa, pol]
timeout_s: 300

covers:
  - localisation.languages
  - localisation.strings
  - localisation.system-language
  - localisation.glyphs
manual_checks:
  - >-
    Glyph rendering is review-only: there is no OCR or region-hash assertion,
    so the captured PNGs must be inspected for missing glyphs and fallback boxes.
  - >-
    Each `focus` step proves the app reported the wanted label as focused,
    within a bounded number of DOWN/UP presses, and names the rows it passed
    when it cannot. That makes a wrong-row failure impossible to confuse with a
    missing glyph; what remains review-only is how the glyphs actually render.

settings:
  sitemap_0: garmin_localisation

steps:
  - action: launch

  - action: wait_for_event
    event: LANGUAGE
    fields:
      code: "${language}"
    timeout_ms: 30000

  - action: wait_for_event
    event: VIEW
    fields:
      category: sitemap
      view: HomepageMenu
    timeout_ms: 60000

  # Connection indicator: Téléphone / Teléfono / Telefon, plus the localised
  # Settings entry, on one screen.
  - action: screenshot
    name: glyphs-homepage

  # Selecting the Empty frame shows the localised EmptyPage toast and keeps the
  # homepage visible. Its position is not assumed: the step scrolls until the
  # app reports the Empty label as focused.
  - action: focus
    description: Move the highlight onto the Empty frame before selecting it.
    view: HomepageMenu
    label: Empty
    max_presses: 5

  - action: press
    button: ENTER

  - action: wait_for_event
    description: The empty-page info toast is shown.
    event: TOAST
    timeout_ms: 15000

  # The toast is an info toast: it must not move the highlight, or the UP below
  # would start from an unknown row.
  - action: assert
    description: The toast did not move the highlight off the Empty frame.
    focus: {view: HomepageMenu, label: Empty}

  - action: screenshot
    name: glyphs-empty-page

  # The toast keeps the homepage (and its highlight) in place, so the Player
  # frame is reached upwards. The direction is the scenario's choice; the step
  # still verifies each row it lands on.
  - action: focus
    description: Move the highlight up onto the Player frame.
    view: HomepageMenu
    label: Player
    button: UP
    max_presses: 5

  # A Frame is a submenu: this select pushes the Player frame's page, it does
  # not open the player. The full-screen view is opened by the player element
  # inside the frame, one level further in.
  - action: press
    button: ENTER

  # The player element's label is the sitemap label
  # (`Switch item=E2E_MediaControl label="Audio"`), not a translated resource,
  # so it is identical in every language. The step also waits for the pushed
  # page to report its own focus before it presses anything.
  - action: focus
    description: The player element inside the Player frame.
    view: PageMenu
    label: Audio
    max_presses: 5
    timeout_ms: 15000

  - action: press
    button: ENTER

  - action: wait_for_event
    description: >-
      Selecting the player element opens PlayerView with the localised input
      hints.
    event: VIEW
    fields:
      category: sitemap
      view: PlayerView
    timeout_ms: 30000

  - action: screenshot
    name: glyphs-player

  - action: assert
    description: No error view appears while the glyphs are rendered.
    never_error_view: true
