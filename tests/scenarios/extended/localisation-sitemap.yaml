# Extended: a normal sitemap page in every shipped language.
#
# The app-localised strings on this page are the menu title chrome, the
# connection-mode indicator ("Telefon (BLE)" / "Téléphone (BLE)" / ...), the
# Settings entry, and the control labels of the Player view. The screenshots
# are the rendering evidence; the locale itself is machine-asserted through
# the LANGUAGE trace event, so a run cannot silently fall back to English.
#
# The dedicated `garmin_localisation` sitemap keeps the menu small enough that
# the number of DOWN presses is stable. See tests/docs/localisation.md.

name: localisation-sitemap
description: A normal sitemap page and a control view render in the requested language.
tier: ui
suite: extended
device: edge540
mode: ble
fixture: fast-polling
openhab:
  profile: stable
  sitemap: garmin_localisation
  items:
    E2E_Toggle: "OFF"
    E2E_Light: "ON"
    E2E_GarageDoor: "OFF"
    E2E_MediaControl: "PLAY"
    E2E_Temperature: "21.5"
languages: [eng, deu, fre, ita, spa, pol]
timeout_s: 150

covers:
  - localisation.languages
  - localisation.strings
  - localisation.system-language
  - localisation.layout
  - lifecycle.device-matrix-and-strings
manual_checks:
  - >-
    Rendered text is reviewed in screenshots; the harness has no OCR or text
    assertion. This covers the screens the scenario visits, not a
    string-by-string inventory, and glance/widget strings are not visited.

settings:
  sitemap_0: garmin_localisation

steps:
  - action: launch

  - action: wait_for_event
    description: The simulator really runs in the scenario language.
    event: LANGUAGE
    fields:
      code: "${language}"
    timeout_ms: 30000

  - action: wait_for_event
    description: The homepage is rendered before navigating.
    event: VIEW
    fields:
      category: sitemap
      view: HomepageMenu
    timeout_ms: 60000

  # Homepage: title, frame labels, connection-mode indicator, Settings entry.
  - action: screenshot
    name: localisation-homepage

  # Switches is the first frame: control labels and states.
  - action: press
    button: ENTER

  - action: wait_for_event
    description: The Switches frame opens.
    event: VIEW
    fields:
      category: sitemap
      view: PageMenu
    timeout_ms: 30000

  - action: screenshot
    name: localisation-switches

  - action: press
    button: BACK

  # Player is the second frame; its full-screen view renders the localised
  # Play/Pause/Next/Previous labels.
  - action: press
    button: DOWN

  - action: press
    button: ENTER

  - action: wait_for_event
    description: The Player control view opens.
    event: VIEW
    fields:
      category: sitemap
      view: PlayerView
    timeout_ms: 30000

  - action: screenshot
    name: localisation-player

  - action: assert
    description: No error view interrupts the normal page.
    never_error_view: true
