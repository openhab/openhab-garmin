# Extended: a normal sitemap page in every shipped language.
#
# The app-localised strings on this page are the menu title chrome, the
# connection-mode indicator ("Telefon (BLE)" / "Téléphone (BLE)" / ...), the
# Settings entry, and the control labels of the Player view. The screenshots
# are the rendering evidence; the locale itself is machine-asserted through
# the LANGUAGE trace event, so a run cannot silently fall back to English.
#
# Rows are addressed by their focused label (`E2E:FOCUS`), not by a press
# count: the same DOWN count lands on a different row when a device's layout
# scrolls differently, which is what failed on edge540 (#430). A `focus` step
# re-issues only DOWN/UP, and only after the app reported where the highlight
# is, so it can never select a row nobody looked at. See
# tests/docs/scenarios.md ("Addressing an element").

name: localisation-sitemap
description: A normal sitemap page and a control view render in the requested language.
tier: ui
suite: extended
device: edge540
mode: ble
fixture: fast-polling
openhab:
  profile: stable
  sitemap: garmin_localisation
  items:
    E2E_Toggle: "OFF"
    E2E_Light: "ON"
    E2E_GarageDoor: "OFF"
    E2E_MediaControl: "PLAY"
    E2E_Temperature: "21.5"
languages: [eng, deu, fre, ita, spa, pol]
timeout_s: 300

covers:
  - localisation.languages
  - localisation.strings
  - localisation.system-language
  - localisation.layout
  - lifecycle.device-matrix-and-strings
manual_checks:
  - >-
    Rendered text is reviewed in screenshots; the harness has no OCR or text
    assertion. This covers the screens the scenario visits, not a
    string-by-string inventory, and glance/widget strings are not visited.
  - >-
    The row order itself is not asserted for its own sake: each `focus` step
    proves the app reported the wanted label as focused, in at most
    `max_presses` DOWN/UP presses, and names the rows it passed when it cannot.
    What remains review-only is whether the rendered label looks right.

settings:
  sitemap_0: garmin_localisation

steps:
  - action: launch

  - action: wait_for_event
    description: The simulator really runs in the scenario language.
    event: LANGUAGE
    fields:
      code: "${language}"
    timeout_ms: 30000

  - action: wait_for_event
    description: The homepage is rendered before navigating.
    event: VIEW
    fields:
      category: sitemap
      view: HomepageMenu
    timeout_ms: 60000

  # Homepage: title, frame labels, connection-mode indicator, Settings entry.
  - action: screenshot
    name: localisation-homepage

  # Switches is the first frame: control labels and states.
  - action: focus
    description: Move the highlight onto the Switches frame before selecting it.
    view: HomepageMenu
    label: Switches
    max_presses: 5

  - action: press
    button: ENTER

  - action: wait_for_event
    description: The Switches frame opens.
    event: VIEW
    fields:
      category: sitemap
      view: PageMenu
    timeout_ms: 30000

  - action: screenshot
    name: localisation-switches

  - action: press
    button: BACK

  # Player's full-screen view renders the localised Play/Pause/Next/Previous
  # labels. The homepage is re-entered from BACK, so its focus is whatever row
  # was selected before; DOWN is issued only until the app reports Player.
  - action: focus
    description: Move the highlight back onto the Player frame.
    view: HomepageMenu
    label: Player
    max_presses: 5

  - action: press
    button: ENTER

  - action: wait_for_event
    description: >-
      Back on the homepage, selecting the Player frame opens PlayerView.
    event: VIEW
    fields:
      category: sitemap
      view: PlayerView
    timeout_ms: 30000

  - action: screenshot
    name: localisation-player

  - action: assert
    description: No error view interrupts the normal page.
    never_error_view: true
