# Extended: the longest translated error string on the narrowest device.
#
# An empty `url_0` makes AppSettings throw `ConfigException`, which the app
# renders in the full-screen error view. The message is `ErrorConfigUrlMissing`
# (130 chars in French, 129 in Spanish, 120 in German and Italian), so it
# is the primary wrapping/truncation case for the whole message.
#
# The empty value must reach the compiled `settings.xml` as an explicit empty
# string: `scenario_settings` carries it through instead of substituting the
# shim URL, and the build asserts the compiled default is `""`. Omitting the
# key instead would make `Properties.getValue` return null and crash (#417).
# The zero-request assertion below is what proves the app really ran
# unconfigured; before #430 the override was silently dropped, the app polled
# ~35 times and only "passed" because it never showed an error.
#
# edge540 is the narrowest `ui` device in the approved matrix (246 px wide) and
# uses the largest menu font; see tests/docs/localisation.md for the rationale.
# The ERRORVIEW id (`UI:CONFIG`) is machine-asserted; the rendered text is
# review-only.

name: localisation-error-config-url
description: The missing-URL error view renders the longest translated message.
tier: ui
suite: extended
device: edge540
mode: ble
fixture: fast-polling
openhab:
  profile: stable
  sitemap: garmin_localisation
languages: [eng, deu, fre, ita, spa, pol]
timeout_s: 300

covers:
  - localisation.languages
  - localisation.strings
  - localisation.system-language
  - localisation.errors
  - localisation.layout
  - errors.codes-messages
manual_checks:
  - >-
    The ERRORVIEW id, the error view being the current view, and the app
    making no request at all are machine-asserted; the wrapped or truncated
    rendered text is review-only.

settings:
  sitemap_0: garmin_localisation
  url_0: ""

steps:
  - action: launch

  - action: wait_for_event
    event: LANGUAGE
    fields:
      code: "${language}"
    timeout_ms: 30000

  - action: wait_for_event
    description: A missing server URL shows the configuration error view.
    event: ERRORVIEW
    fields:
      id: "UI:CONFIG"
    timeout_ms: 30000

  - action: assert
    description: >-
      An unconfigured app cannot reach the server at all, so the shim must stay
      untouched. A single request here means the empty URL was replaced by a
      real endpoint and the error view above proves nothing.
    shim_requests:
      max_count: 0

  - action: screenshot
    name: error-config-url

  - action: assert
    description: The configuration error is a full-screen error, not a toast.
    no_error_view: false
