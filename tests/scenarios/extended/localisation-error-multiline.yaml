# Extended: a nested/multi-line translated error string.
#
# `ErrorNoPhoneDetail` is the exemplar ("$1$: No phone&#10;($2$)"): a translated
# prefix followed by a value on its own line. The -104 SDK error behind it
# cannot be scripted through the shim, so this scenario exercises the same
# layout with the deterministic -400 path instead: a 200 response whose content
# type is not JSON. The app renders `ErrorInvalidResponseDetail` (or the
# equivalent multi-line detail), which has the same prefix-over-newline-value
# shape and is accented in German, French and Polish.
#
# The ERRORVIEW existence is machine-asserted; the exact rendered text is
# review-only because the SDK may report -400 or a null response depending on
# the device and phone OS (see `CommunicationException`/`UnexpectedResponseException`).

name: localisation-error-multiline
description: A multi-line translated error detail renders in the full-screen error view.
tier: ui
suite: extended
device: edge540
mode: ble
fixture: default
openhab:
  profile: stable
  sitemap: garmin_localisation
languages: [eng, deu, fre, ita, spa, pol]
timeout_s: 150

settings:
  sitemap_0: garmin_localisation

shim:
  rules:
    - name: not-json
      match:
        method: GET
        path_prefix: /rest/sitemaps/garmin_localisation
      times: 5
      response:
        status: 200
        body: "this is not a JSON sitemap"
        content_type: "text/plain; charset=utf-8"

steps:
  - action: launch

  - action: wait_for_event
    event: LANGUAGE
    fields:
      code: "${language}"
    timeout_ms: 30000

  - action: wait_for_event
    description: The wrong content type is a critical communication error.
    event: ERROR
    fields:
      kind: critical
    timeout_ms: 45000

  - action: wait_for_event
    description: The error detail is shown full-screen.
    event: ERRORVIEW
    timeout_ms: 30000

  - action: screenshot
    name: error-multiline

  - action: assert
    no_error_view: false
