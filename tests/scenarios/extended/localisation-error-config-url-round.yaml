# Extended: the longest error string on a round screen.
#
# `ErrorView` sizes its TextArea to the largest square inscribed in the circle
# on round devices; at 260 px that is about 184 px, narrower than the edge540
# rectangle. This scenario is the round-screen complement to
# `localisation-error-config-url`, and is deliberately a separate device
# selection instead of a second device in the device matrix (#366 owns that).
#
# ERRORVIEW id (`UI:CONFIG`) is machine-asserted; text rendering is review-only.
#
# The empty `url_0` is carried through as an explicit empty string (see
# `scenario_settings`), and the zero-request assertion proves the app ran
# unconfigured instead of polling a substituted shim URL.

name: localisation-error-config-url-round
description: The missing-URL error view also wraps on a round screen.
tier: ui
suite: extended
device: fenix7
mode: ble
fixture: fast-polling
openhab:
  profile: stable
  sitemap: garmin_localisation
languages: [eng, deu, fre, ita, spa, pol]
timeout_s: 300

covers:
  - localisation.languages
  - localisation.strings
  - localisation.system-language
  - localisation.errors
  - localisation.layout
  - lifecycle.cold-start
  - errors.codes-messages
manual_checks:
  - >-
    The ERRORVIEW id, the error view being the current view, and the app
    making no request at all are machine-asserted; the wrapped or truncated
    rendered text is review-only.

settings:
  sitemap_0: garmin_localisation
  url_0: ""

steps:
  - action: launch

  - action: wait_for_event
    event: LANGUAGE
    fields:
      code: "${language}"
    timeout_ms: 30000

  - action: wait_for_event
    description: A missing server URL shows the configuration error view.
    event: ERRORVIEW
    fields:
      id: "UI:CONFIG"
    timeout_ms: 30000

  - action: assert
    description: >-
      An unconfigured app cannot reach the server at all, so the shim must stay
      untouched. A single request here means the empty URL was replaced by a
      real endpoint and the error view above proves nothing.
    shim_requests:
      max_count: 0

  - action: screenshot
    name: error-config-url-round

  - action: assert
    description: The full-screen error view is the current view.
    no_error_view: false
