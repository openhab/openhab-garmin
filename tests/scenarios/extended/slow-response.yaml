# Extended: a slow server.
#
# A slow sitemap poll is not an error while the response still arrives. The app
# makes one request at a time, waits for the delayed response, applies the
# sitemap and keeps polling. openHAB itself stays healthy because only the shim
# delays the response.
#
# The Connect IQ SDK 9.3.0 API has no :timeout option for makeWebRequest and
# does not document a request timeout default, so neither the app nor the
# harness can turn a slow response into a timeout. This scenario therefore
# proves latency tolerance, not escalation; extended/escalation-window asserts
# escalation using repeated failures.

name: slow-response
description: A slow sitemap response is applied without an error view.
tier: protocol
suite: extended
device: fenix7
mode: ble
fixture: fast-polling
openhab:
  profile: stable
  sitemap: garmin_e2e
  items:
    E2E_Temperature: "20.0"
language: eng
timeout_s: 180

covers:
  - limits.slow-and-rapid
manual_checks:
  - >-
    "Applied without an error view" is machine-asserted as a SITEMAP success
    event plus never_error_view. The exact latency bound, and whether a
    response slower than the transport timeout would still be applied, are not
    measured.
  - Rapid successive updates are not exercised; only delayed responses are.

shim:
  rules:
    - name: slow
      match:
        method: GET
        path_prefix: /rest/sitemaps/garmin_e2e
      times: 3
      delay_ms: 4000
      response:
        status: 200
        body: '{"homepage":{"id":"slow","widgets":[]}}'
        content_type: application/json

steps:
  - action: launch

  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_e2e
    min_count: 1
    timeout_ms: 60000

  - action: assert
    description: The delayed request is recorded and answered with 200.
    shim_requests:
      method: GET
      path_prefix: /rest/sitemaps/garmin_e2e
      min_count: 1
      status: 200

  # The app has exactly one request in flight, so the first accepted sitemap
  # can only come from a delayed response. No error view may appear while the
  # app waits for it.
  - action: wait_for_event
    description: The delayed response is applied to the sitemap.
    event: SITEMAP
    fields:
      result: success
    timeout_ms: 60000

  - action: screenshot
    name: slow-response

  # After the three delayed polls the app must keep polling on its own.
  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_e2e
    min_count: 5
    timeout_ms: 90000

  # One poll interval of fast-polling for the app to settle.
  - action: wait
    ms: 1500

  - action: screenshot
    name: applied

  - action: assert
    description: >-
      No error view appeared at any point: a slow response was applied as a
      normal update instead of being treated as a failure.
    never_error_view: true
