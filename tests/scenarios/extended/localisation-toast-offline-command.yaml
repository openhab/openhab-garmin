# Extended: the offline-command toast in every shipped language.
#
# With no connectivity, selecting a control must not send anything; the app
# raises `OfflineCommandException`, which is shown as the localised OFFLINE
# toast. The TOAST id (`UI:03`) is machine-asserted; the rendered uppercase
# text is review-only.
#
# UNVERIFIED (#430). This scenario cannot pass in its current form, and the
# steps below are deliberately left as written so the failure stays visible.
#
# The toast needs a rendered page, so the app must start offline *with* a
# cached sitemap. It cannot: the driver calls `clear_app_data()` before every
# launch (only `E2E_WINE_KEEP_APP_DATA=1` skips it), so the sitemap cache from
# an earlier BLE scenario is gone by the time this one starts. Offline with no
# cache, the app raises `OfflineWithoutSitemapException` and shows the
# `S:OFFLINE` error view instead of a `HomepageMenu`, which is why the VIEW
# assertion fails rather than the toast.
#
# Two harness capabilities would make it testable, neither available today:
# seeding `SitemapStore`'s cache before an offline launch, or switching
# connection mode mid-run (`restart_in_mode()` exists but is probe-only, and a
# restart is not the mid-run transition this behaviour is about). The mode
# keys (`BleState`/`WifiState`) are written and recorded by the driver, so the
# start-up mode itself is not the suspect here.

name: localisation-toast-offline-command
description: An offline command attempt shows the translated OFFLINE toast and sends nothing.
tier: ui
suite: extended
device: edge540
mode: offline
fixture: fast-polling
openhab:
  profile: stable
  sitemap: garmin_localisation
  items:
    E2E_Toggle: "OFF"
    E2E_MediaControl: "PLAY"
    E2E_Temperature: "21.5"
languages: [eng, deu, fre, ita, spa, pol]
timeout_s: 300

covers:
  - localisation.languages
  - localisation.strings
  - localisation.system-language
  - localisation.layout
  - communication.command-semantics
manual_checks:
  - >-
    The toast text is reviewed in screenshots; the harness asserts that a toast
    appeared and that no command was sent, not what the toast says.

settings:
  sitemap_0: garmin_localisation

steps:
  - action: launch

  - action: wait_for_event
    event: LANGUAGE
    fields:
      code: "${language}"
    timeout_ms: 30000

  - action: wait_for_event
    description: The cached localisation sitemap is shown while offline.
    event: VIEW
    fields:
      category: sitemap
      view: HomepageMenu
    timeout_ms: 60000

  # Switches is the first frame; Toggle Switch is its first element.
  - action: press
    button: ENTER

  - action: press
    button: ENTER

  - action: wait_for_event
    description: The offline command toast is reported.
    event: TOAST
    fields:
      id: UI:03
    timeout_ms: 15000

  - action: screenshot
    name: offline-command-toast

  - action: assert
    description: An offline command attempt sends nothing.
    shim_requests:
      method: POST
      max_count: 0
