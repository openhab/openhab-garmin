# Smoke: a Switch element sends a REST command for the same item.
#
# Covers the command path end to end: selecting the element issues
# `POST /rest/items/E2E_Toggle` with body `ON`, and nothing else changes.
# The post-command hold time is disabled in the fixture so the state update is
# observable within one poll.

name: toggle-switch
description: Selecting a toggle switch sends the ON command through the shim.
tier: ui
suite: smoke
device: fenix7
mode: ble
fixture: fast-polling
openhab:
  profile: stable
  sitemap: garmin_commands
  items:
    E2E_Toggle: "OFF"
language: eng
timeout_s: 300

covers:
  - sitemap.element-types
  - sitemap.parameters-controls
  - commands.paths
  - commands.types
manual_checks:
  - >-
    Rollershutter and player controls are not driven; only the toggle switch is.
  - The webhook fallback is covered by webhook-command-path, not here.

settings:
  sitemap_0: garmin_commands

steps:
  - action: launch

  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_commands
    min_count: 1
    timeout_ms: 30000

  - action: reset_shim

  # The press must land on the homepage: a click sent while the menu is still
  # being built is consumed by the view change and never reaches the delegate.
  - action: wait_for_view
    description: The homepage menu is on screen before the opening press.
    category: sitemap
    view: HomepageMenu
    timeout_ms: 30000

  # Widgets is the first frame of garmin_commands: open it, then select its
  # first element (the toggle). A Frame is a submenu in the app, so one ENTER
  # only opens the page; the second activates the element. `expect: input`
  # requires the app's own event, so a repaint cannot pass for a delivered
  # press; the driver re-issues an unacknowledged press once.
  - action: press
    button: ENTER
    expect: input
    timeout_ms: 6000

  - action: wait_for_event
    description: The Widgets frame page is rendered before selecting its element.
    event: VIEW
    fields:
      category: sitemap
      view: PageMenu
    timeout_ms: 30000

  - action: press
    button: ENTER

  - action: wait_for_request
    method: POST
    path_prefix: /rest/items/E2E_Toggle
    min_count: 1
    timeout_ms: 15000

  - action: assert
    description: Exactly one command is sent, addressed to the selected item.
    shim_requests:
      method: POST
      path_prefix: /rest/items/E2E_Toggle
      min_count: 1
      max_count: 1
      body_equals: "ON"
      status: 200

  - action: screenshot
    name: after-toggle

  - action: assert
    description: No error view appears on the happy path.
    never_error_view: true
