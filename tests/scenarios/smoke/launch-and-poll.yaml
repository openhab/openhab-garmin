# Smoke: the app launches, resolves the sitemap and renders the homepage.
#
# The narrowest end-to-end proof that the stack is wired correctly: shim sees
# the poll, openHAB answers, the app renders. Everything else in `smoke/`
# assumes this scenario passes.

name: launch-and-poll
description: App starts, polls the sitemap through the shim and shows the homepage.
tier: ui
suite: smoke
device: fenix7
mode: ble
fixture: default
openhab:
  profile: stable
  sitemap: garmin_e2e
  items:
    E2E_Light: "ON"
    E2E_Light2: "OFF"
    E2E_Temperature: "21.5"
    E2E_EntranceGates_Status: CLOSED
language: eng
timeout_s: 300

covers:
  - sitemap.element-types
  - lifecycle.cold-start
  - limits.small-sitemaps
manual_checks:
  - >-
    Selection, Setpoint and Slider elements are present in the fixture but are
    not driven by this scenario.

steps:
  - action: launch

  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_e2e
    min_count: 1
    timeout_ms: 30000

  # The request is recorded before the app has painted the menu, so waiting for
  # the HTTP call is not enough: the screenshot must wait for the view, or the
  # golden captures whatever the app was showing (the glance, once).
  - action: wait_for_view
    category: sitemap
    view: HomepageMenu
    timeout_ms: 60000

  - action: screenshot
    name: homepage

  - action: assert
    description: The sitemap poll is proxied to openHAB and answered with 200.
    shim_requests:
      method: GET
      path_prefix: /rest/sitemaps/garmin_e2e
      min_count: 1
      status: 200

  - action: assert
    description: No error view is shown at any point in a healthy run.
    never_error_view: true

  - action: assert
    description: The homepage renders as expected (baseline captured once and reviewed by a human).
    golden:
      name: homepage
      # A whole-window baseline: the simulator's status strip has live counters,
      # measured at 157 differing pixels (0.06%) between two captures of the same
      # view. The wrong state differs by ~1.6%, so this tolerates the strip and
      # still fails on the glance.
      max_diff_ratio: 0.002
      # Fail closed on the wrong state: the capture must be the sitemap menu. This
      # is what prevents a reproducible glance screenshot becoming the baseline.
      expect:
        category: sitemap
        view: HomepageMenu
      # Pixel backstop. Whole-window blob counts are close between states (the
      # glance measured 64, the menu 76), so this is a floor against an unpainted
      # window, not the state check: the view check above is the enforcement.
      min_ink_components: 40
