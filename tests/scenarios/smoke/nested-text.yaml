# Smoke: nested containers and read-only elements.
#
# Walks into the `Text` frame, opens the manually nested page and checks that
# navigation does not disturb polling: the app keeps requesting the sitemap
# while a subpage is open.

name: nested-text
description: Nested Text pages open and polling continues while they are shown.
tier: ui
suite: smoke
device: fenix7
mode: ble
fixture: default
openhab:
  profile: stable
  sitemap: garmin_e2e
  items:
    E2E_Temperature: "19.0"
    E2E_LastUpdate: "2026-11-23T10:00:00.000+0100"
    E2E_Window: CLOSED
language: eng
timeout_s: 300

covers:
  - sitemap.element-types
  - sitemap.nesting

steps:
  - action: launch

  - action: wait_for_request
    method: GET
    path_prefix: /rest/sitemaps/garmin_e2e
    min_count: 1
    timeout_ms: 30000

  - action: reset_shim

  # `Text` is the first frame on the homepage. A Frame opens as a submenu, so
  # wait for its page before paging: the app builds frame children
  # asynchronously after the page is shown. The press is measured because a
  # click lost right after the view appears would otherwise surface as a missing
  # page two steps later.
  - action: press
    button: ENTER
    expect: effect
    timeout_ms: 6000

  - action: wait_for_event
    description: The Text frame page is rendered before paging down.
    event: VIEW
    fields:
      category: sitemap
      view: PageMenu
    timeout_ms: 30000

  - action: screenshot
    name: text-frame

  # The entries are, in order: Temperature, TV, Window, Last Update, the static
  # "This text has no item" text, then "Nested page" — so five page-downs from
  # the first entry. The static text occupies an index even though it cannot be
  # activated; counting it is what keeps this navigation unambiguous.
  - action: press
    button: DOWN
    count: 5
    expect: effect
    timeout_ms: 6000

  - action: press
    button: ENTER
    expect: effect
    timeout_ms: 6000

  - action: wait_for_event
    description: The nested page is open (one level deeper than the frame page).
    event: VIEW
    fields:
      category: sitemap
      view: PageMenu
      depth: 3
    timeout_ms: 15000

  - action: screenshot
    name: nested-page

  - action: assert
    description: Polling continues while a nested page is open.
    shim_requests:
      method: GET
      path_prefix: /rest/sitemaps/garmin_e2e
      min_count: 2

  - action: assert
    description: No error view appears on the happy path.
    never_error_view: true
