name: CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '.github/**/*.md'
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '.github/**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: CI Build (${{ matrix.device }})
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Representative subset covering the supported CIQ API levels and
        # input/display families. No supported device runs CIQ 4.x, so venu2
        # (API level 5.0) represents the lowest annotCiq400Plus tier.
        # The device definitions in .github/ConnectIQ/Devices are reduced to
        # the files needed for compilation.
        device:
          - fenix6pro   # CIQ 3.4, button-based Fenix
          - venu2       # CIQ 5.0, touch-based Venu
          - venu3       # CIQ 5.2, touch-based Venu
          - fenix847mm  # CIQ 6.0, button-based Fenix (default device)
          - edge540     # CIQ 6.0, Edge cycling computer
    steps:
      - name: Checkout
        if: github.head_ref == ''
        uses: actions/checkout@v7

      - name: Checkout merge
        if: github.head_ref != ''
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{github.event.pull_request.number}}/merge

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build
        id: build
        run: './.github/scripts/monkeyc-build'
        env:
          DEVICE: ${{ matrix.device }}

      # this will identify modifications to files under source control during the workflow run;
      # untracked files will be included as well!
      - name: Verify Changed Files
        id: verify-changed-files
        run: |
          set -o pipefail
          changed_files=$(echo -n "$(git diff --name-only HEAD && git ls-files --others --exclude-standard)"|tr '\n' ' ')
          echo "changed_files=$changed_files" >> $GITHUB_OUTPUT

      - name: Fail on Changed Files
        if: steps.verify-changed-files.outputs.changed_files != ''
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "::error::Files have changed: $CHANGED_FILES"
          exit 1

  # The branch ruleset requires a status check named "CI Build". The matrix
  # jobs are named individually, so this job aggregates their results into
  # that single required check.
  ci-build:
    name: CI Build
    needs: build
    if: always()
    runs-on: 'ubuntu-latest'
    steps:
      - name: Verify all device builds succeeded
        if: needs.build.result != 'success'
        run: |
          echo "::error::Device build matrix result: ${{ needs.build.result }}"
          exit 1
