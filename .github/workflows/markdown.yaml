name: Check Markdown For Errors

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.github/markdownlint.yaml'
      - '.github/mlc_config.json'
      - '.github/workflows/markdown.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.github/markdownlint.yaml'
      - '.github/mlc_config.json'
      - '.github/workflows/markdown.yaml'
  workflow_dispatch:

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # pinning to SHA to mitigate possible supply chain attack
      - name: Run markdownlint-cli
        uses: nosborn/github-action-markdown-cli@508d6cefd8f0cc99eab5d2d4685b1d5f470042c1 # v3.5.0
        with:
          files: .
          config_file: ".github/markdownlint.yaml"

  markdown-link-check:
    name: Broken Links Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # pinning to SHA to mitigate possible supply chain attack
      - name: Check for broken links
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        with:
          use-quiet-mode: 'yes' # only show errors in output
          use-verbose-mode: 'yes' # show detailed HTTP status for checked links
          config-file: '.github/mlc_config.json'

      # The action exports the link checker output as MLC_OUTPUT, but only on
      # failure and only to the step log, which requires a GitHub login to read.
      # Surface the dead links in the job summary and as an annotation so the
      # failing link can be identified without access to the raw log.
      - name: Report broken links
        if: failure()
        shell: bash
        run: |
          {
            echo "### Broken links check failed"
            echo
            if [[ -z "${MLC_OUTPUT:-}" ]]; then
              echo "No link details were captured, see the step log."
            else
              # The captured output also contains the debug trace and one line
              # per checked link; keep only the dead links and the error summary.
              printf '%s\n' "${MLC_OUTPUT}" | grep -E 'ERROR:|✖' || printf '%s\n' "${MLC_OUTPUT}"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # Annotations are visible without repository access, so emit one per
          # failing link instead of hiding the URL in the step log.
          if [[ -n "${MLC_OUTPUT:-}" ]]; then
            while IFS= read -r line; do
              echo "::error::${line}"
            done < <(printf '%s\n' "${MLC_OUTPUT}" | grep -E '\[✖\]')
          fi

          echo "::error title=Broken links::Markdown link check failed, see the job summary."
